name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      # 判断是否为「代码类提交」，供后续步骤统一门控
      - name: 判断是否代码类提交
        id: meta
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG="$HEAD_MSG"
          else
            MSG="$PR_TITLE"
          fi
          if printf '%s' "$MSG" | grep -Eq '(feat|fix|refactor|build)'; then
            echo "is_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 读取版本号
        id: version
        if: steps.meta.outputs.is_code == 'true'
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: 打包项目
        id: package
        if: steps.meta.outputs.is_code == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="eating-medication-v${VERSION}.zip"
          # 打包整个仓库（排除 .git / .env / 缓存），生成与 updater.py 兼容的完整发布包
          zip -r "$ZIP" . -x '.git/*' -x '.env' -x '*/__pycache__/*' -x '*.pyc' -x '*.pyo' -x '.venv/*' -x 'venv/*'
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: 创建 tag 并上传发布资产
        if: steps.meta.outputs.is_code == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PAT: ${{ secrets.PAT }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP="${{ steps.package.outputs.zip }}"
          MSG="$HEAD_MSG"
          # checkout 已使用 secrets.PAT 鉴权，直接以 PAT 推送 tag（无需 insteadOf 改写）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 根据版本号查找 tag，不存在则创建「带提交信息注解的 tag」并推送
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，跳过创建"
          else
            # tag 注解直接使用本次提交信息（HEAD_MSG）
            git tag -a "$TAG" -m "$MSG"
            git push origin "$TAG"
            echo "已创建并推送带注解的 tag: $TAG"
          fi
          # 查找 release，不存在则创建（release 说明同样使用提交信息）
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，上传/更新资产"
          else
            gh release create "$TAG" --title "$TAG" -n "$MSG"
          fi
          # 使用 gh CLI 上传资产文件（已存在则覆盖）
          gh release upload "$TAG" "$ZIP" --clobber

      - name: 生成 Release Attestation
        if: steps.meta.outputs.is_code == 'true' && github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: "${{ steps.package.outputs.zip }}"
          subject-path: "${{ steps.package.outputs.zip }}"

      - name: Set up Python 3.13
        if: steps.meta.outputs.is_code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.meta.outputs.is_code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r elderly_assistant/requirements.txt
          pip install -r server/requirements.txt
          pip install -r family_monitor/requirements.txt
          pip install "pytest==8.3.3" "pytest-asyncio==0.24.0"

      - name: Test with pytest
        if: steps.meta.outputs.is_code == 'true'
        run: pytest

      # 部署端更新通知：原 update.yml 的逻辑，任何 push/PR 都会执行
      - name: update
        env:
          PUBLIC_URL: https://my-website.ccwu.cc/eating-medication
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "PUBLIC_URL 未配置，跳过 update"
            exit 0
          fi
          echo "目标地址: $PUBLIC_URL"
          UPDATE_URL="${PUBLIC_URL%/}/server/api/v1/updater"
          echo "update 接口: $UPDATE_URL"
          # 触发正在运行的服务器自更新（POST 才会执行 check_for_update）
          curl -fsS -X POST "$UPDATE_URL" || echo "update 请求失败（忽略非零退出码）"
