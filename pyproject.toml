[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["server/app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RET", "RUF"]
ignore = [
    "S603",
    "S607",
    "S101",
    "S110",
    "E501",
    "B008",    # Do not perform function call in argument defaults (FastAPI Depends pattern)
    "B904",    # raise from e (annotated where intentional)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
"elderly_assistant/**" = ["S602"]
